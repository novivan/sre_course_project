apiVersion: v1
kind: ConfigMap
metadata:
  name: auction-config
data:
  DB_URL: jdbc:postgresql://postgres:5432/auction
  SERVER_PORT: "8080"
  WORKER_POLL_DELAY: 1s
  WORKER_BATCH_SIZE: "100"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
type: Opaque
stringData:
  POSTGRES_DB: auction
  POSTGRES_USER: auction
  POSTGRES_PASSWORD: auction

