apiVersion: apps/v1
kind: Deployment
metadata:
  name: auction-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auction
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auction
        app.kubernetes.io/component: worker
    spec:
      initContainers:
        - name: wait-for-schema
          image: postgres:17.6-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              until PGPASSWORD="$POSTGRES_PASSWORD" psql -h postgres
              -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc
              "SELECT to_regclass('public.flyway_schema_history')"
              2>/dev/null | grep -q flyway_schema_history; do sleep 2; done
          envFrom:
            - secretRef:
                name: postgres-credentials
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: auction:local
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: auction-config
          env:
            - name: APP_ROLE
              value: worker
            - name: SPRING_MAIN_WEB_APPLICATION_TYPE
              value: none
            - name: SPRING_FLYWAY_ENABLED
              value: "false"
            - name: DB_POOL_SIZE
              value: "2"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
