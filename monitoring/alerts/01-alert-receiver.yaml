apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-receiver-script
data:
  receiver.py: |
    import html
    import json
    import threading
    from datetime import datetime, timezone
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    notifications = []
    lock = threading.Lock()


    class Handler(BaseHTTPRequestHandler):
        def send_text(self, status, body, content_type="text/plain; charset=utf-8"):
            encoded = body.encode("utf-8")
            self.send_response(status)
            self.send_header("Content-Type", content_type)
            self.send_header("Content-Length", str(len(encoded)))
            self.end_headers()
            self.wfile.write(encoded)

        def do_GET(self):
            if self.path == "/health":
                self.send_text(200, "ok")
                return
            if self.path != "/":
                self.send_text(404, "not found")
                return

            with lock:
                items = list(reversed(notifications))

            cards = []
            for item in items:
                payload = item["payload"]
                status = payload.get("status", "unknown")
                for alert in payload.get("alerts", []):
                    labels = alert.get("labels", {})
                    annotations = alert.get("annotations", {})
                    title = labels.get("alertname", "Alert")
                    summary = annotations.get("summary", "")
                    description = annotations.get("description", "")
                    label_text = ", ".join(
                        f"{key}={value}" for key, value in sorted(labels.items())
                    )
                    cards.append(f"""
                      <article class="card {html.escape(status)}">
                        <div class="status">{html.escape(status.upper())}</div>
                        <h2>{html.escape(title)}</h2>
                        <p>{html.escape(summary)}</p>
                        <p>{html.escape(description)}</p>
                        <code>{html.escape(label_text)}</code>
                        <small>Получено: {html.escape(item["received_at"])}</small>
                      </article>
                    """)

            content = "\n".join(cards) or "<p class='empty'>Уведомлений пока нет</p>"
            page = f"""<!doctype html>
            <html lang="ru">
              <head>
                <meta charset="utf-8">
                <meta http-equiv="refresh" content="5">
                <meta name="viewport" content="width=device-width, initial-scale=1">
                <title>Уведомления Alertmanager</title>
                <style>
                  body {{ margin: 0; font-family: sans-serif; background: #f4f7f4; color: #17351f; }}
                  main {{ max-width: 900px; margin: 40px auto; padding: 0 20px; }}
                  h1 {{ color: #26733a; }}
                  .card {{ background: white; border-left: 8px solid #6c757d; border-radius: 8px;
                           margin: 16px 0; padding: 18px; box-shadow: 0 2px 8px #0001; }}
                  .card.firing {{ border-color: #c92a2a; }}
                  .card.resolved {{ border-color: #2f9e44; }}
                  .status {{ font-weight: 700; }}
                  code {{ display: block; margin: 12px 0; white-space: normal; }}
                  small {{ color: #52665a; }}
                  .empty {{ padding: 24px; background: white; border-radius: 8px; }}
                </style>
              </head>
              <body><main><h1>Уведомления Alertmanager</h1>{content}</main></body>
            </html>"""
            self.send_text(200, page, "text/html; charset=utf-8")

        def do_POST(self):
            if self.path != "/alerts":
                self.send_text(404, "not found")
                return
            try:
                length = int(self.headers.get("Content-Length", "0"))
                payload = json.loads(self.rfile.read(length))
            except (ValueError, json.JSONDecodeError):
                self.send_text(400, "invalid json")
                return

            item = {
                "received_at": datetime.now(timezone.utc).isoformat(),
                "payload": payload,
            }
            with lock:
                notifications.append(item)
                del notifications[:-100]
            print(json.dumps(item, ensure_ascii=False), flush=True)
            self.send_text(200, "ok")

        def log_message(self, format, *args):
            return


    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-receiver
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alert-receiver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alert-receiver
    spec:
      containers:
        - name: receiver
          image: python:3.13-alpine
          imagePullPolicy: IfNotPresent
          command: [python, -u, /app/receiver.py]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: alert-receiver-script
---
apiVersion: v1
kind: Service
metadata:
  name: alert-receiver
spec:
  selector:
    app.kubernetes.io/name: alert-receiver
  ports:
    - name: http
      port: 8080
      targetPort: http
