apiVersion: v1
kind: ConfigMap
metadata:
  name: vmalert-rules
data:
  auction-alerts.yaml: |
    groups:
      - name: auction-service
        interval: 15s
        rules:
          - alert: AuctionBusinessFailureRateHigh
            expr: >-
              sum(increase(auction_business_operations_total{service="auction-api",result="failure"}[2m]))
              / clamp_min(sum(increase(auction_business_operations_total{service="auction-api",result=~"success|failure"}[2m])), 1) > 0.10
              and sum(increase(auction_business_operations_total{service="auction-api",result=~"success|failure"}[2m])) >= 5
            for: 30s
            labels:
              severity: critical
              service: auction-api
              category: service
            annotations:
              summary: Много технических ошибок бизнес-операций
              description: Доля failure за 2 минуты больше 10% (текущее значение {{ $value }}).

          - alert: AuctionSyntheticAvailabilityLow
            expr: >-
              1 - sum(increase(auction_probe_checks_total{service="auction-worker",result="failure"}[2m]))
              / clamp_min(sum(increase(auction_probe_checks_total{service="auction-worker"}[2m])), 1) < 0.95
              and sum(increase(auction_probe_checks_total{service="auction-worker"}[2m])) >= 5
            for: 30s
            labels:
              severity: critical
              service: auction-api
              category: service
            annotations:
              summary: Синтетическая доступность API ниже 95%
              description: Пробер worker видит низкую доступность API за последние 2 минуты (текущее значение {{ $value }}).

      - name: auction-runtime
        interval: 15s
        rules:
          - alert: AuctionHttp5xxRateHigh
            expr: >-
              sum(increase(http_server_requests_seconds_count{service="auction-api",status=~"5.."}[2m]))
              / clamp_min(sum(increase(http_server_requests_seconds_count{service="auction-api"}[2m])), 1) > 0.05
              and sum(increase(http_server_requests_seconds_count{service="auction-api"}[2m])) >= 20
            for: 30s
            labels:
              severity: warning
              service: auction-api
              category: spring
            annotations:
              summary: Высокая доля HTTP 5xx
              description: Spring Boot вернул больше 5% ответов 5xx за 2 минуты (текущее значение {{ $value }}).

          - alert: AuctionJvmHeapUsageHigh
            expr: >-
              sum by (service, pod) (jvm_memory_used_bytes{service=~"auction-api|auction-worker",area="heap"})
              / clamp_min(sum by (service, pod) (jvm_memory_max_bytes{service=~"auction-api|auction-worker",area="heap"}), 1) > 0.85
            for: 2m
            labels:
              severity: warning
              category: jvm
            annotations:
              summary: JVM heap заполнен больше чем на 85%
              description: Высокое использование heap у {{ $labels.service }} в pod {{ $labels.pod }} (текущее значение {{ $value }}).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmalert
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vmalert
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vmalert
    spec:
      containers:
        - name: vmalert
          image: victoriametrics/vmalert:v1.154.0
          imagePullPolicy: IfNotPresent
          args:
            - -rule=/etc/vmalert/rules/auction-alerts.yaml
            - -datasource.url=http://vm-single-victoria-metrics-single-server.monitoring.svc.cluster.local:8428
            - -notifier.url=http://alertmanager.monitoring.svc.cluster.local:9093
            - -evaluationInterval=15s
            - -httpListenAddr=:8880
          ports:
            - name: http
              containerPort: 8880
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: rules
              mountPath: /etc/vmalert/rules
              readOnly: true
      volumes:
        - name: rules
          configMap:
            name: vmalert-rules
---
apiVersion: v1
kind: Service
metadata:
  name: vmalert
spec:
  selector:
    app.kubernetes.io/name: vmalert
  ports:
    - name: http
      port: 8880
      targetPort: http
