apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - 00-namespace.yaml
  - 01-grafana.yaml
configMapGenerator:
  - name: grafana-datasources
    files:
      - datasources.yaml=provisioning/datasources.yaml
  - name: grafana-dashboard-providers
    files:
      - dashboards.yaml=provisioning/dashboards.yaml
  - name: grafana-dashboards
    files:
      - auction-overview.json=dashboards/auction-overview.json
      - postgres-exporter.json=dashboards/postgres-exporter.json
generatorOptions:
  disableNameSuffixHash: true
