spring:
  application:
    name: auction
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auction}
    username: ${DB_USERNAME:auction}
    password: ${DB_PASSWORD:auction}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 3000
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  role: ${APP_ROLE:api}
  worker:
    poll-delay: ${WORKER_POLL_DELAY:1s}
    batch-size: ${WORKER_BATCH_SIZE:100}
