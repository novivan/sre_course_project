apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: auction-route
  namespace: auction
spec:
  parentRefs:
    - name: auction-gateway
  rules:
    - matches:
        - headers:
            - type: Exact
              name: x-user-group
              value: beta
      backendRefs:
        - name: auction-api-v2
          port: 80
    - backendRefs:
        - name: auction-api-v1
          port: 80
