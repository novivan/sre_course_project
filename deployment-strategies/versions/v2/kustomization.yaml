apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: auction
resources:
  - ../base
nameSuffix: -v2
labels:
  - pairs:
      app.kubernetes.io/version: v2.0.0
    includeSelectors: true
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: auction-api
      spec:
        template:
          spec:
            containers:
              - name: api
                env:
                  - name: APP_VERSION
                    value: v2.0.0
